<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Schedule Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
    <!-- Header -->
    <header class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-[1800px] mx-auto px-4 py-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <h1 class="text-xl font-bold text-gray-900 dark:text-white" data-i18n="app.title">Weekly Schedule Manager</h1>
                    <span id="currentWeekDisplay" class="text-sm text-gray-600 dark:text-gray-400"></span>
                </div>
                <div class="flex items-center space-x-2">
                    <!-- Language Switcher -->
                    <select id="languageSwitcher" class="text-sm border border-gray-300 dark:border-gray-600 rounded px-2 py-1 bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                        <option value="en">English</option>
                        <option value="vi">Tiếng Việt</option>
                    </select>
                    <!-- Dark Mode Toggle -->
                    <button id="darkModeToggle" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700" title="Toggle dark mode">
                        <svg class="w-5 h-5 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                        </svg>
                    </button>
                    <!-- Settings Button -->
                    <button id="settingsBtn" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700" title="Settings">
                        <svg class="w-5 h-5 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                    </button>
                    <!-- Export/Import -->
                    <button id="exportBtn" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700" title="Export data">
                        <svg class="w-5 h-5 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                        </svg>
                    </button>
                    <button id="importBtn" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700" title="Import data">
                        <svg class="w-5 h-5 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content - Compact Weekly Grid -->
    <main class="max-w-[1800px] mx-auto px-4 py-4">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
            <!-- Grid Container - No scroll, compact view -->
            <div id="weeklyGrid" class="grid grid-cols-8 gap-px bg-gray-200 dark:bg-gray-700">
                <!-- Header Row -->
                <div class="bg-gray-100 dark:bg-gray-800 p-2 text-center">
                    <span class="text-xs font-semibold text-gray-700 dark:text-gray-300" data-i18n="grid.time">Time</span>
                </div>
                <div class="bg-gray-100 dark:bg-gray-800 p-2 text-center">
                    <span class="text-xs font-semibold text-gray-700 dark:text-gray-300">Mon</span>
                </div>
                <div class="bg-gray-100 dark:bg-gray-800 p-2 text-center">
                    <span class="text-xs font-semibold text-gray-700 dark:text-gray-300">Tue</span>
                </div>
                <div class="bg-gray-100 dark:bg-gray-800 p-2 text-center">
                    <span class="text-xs font-semibold text-gray-700 dark:text-gray-300">Wed</span>
                </div>
                <div class="bg-gray-100 dark:bg-gray-800 p-2 text-center">
                    <span class="text-xs font-semibold text-gray-700 dark:text-gray-300">Thu</span>
                </div>
                <div class="bg-gray-100 dark:bg-gray-800 p-2 text-center">
                    <span class="text-xs font-semibold text-gray-700 dark:text-gray-300">Fri</span>
                </div>
                <div class="bg-gray-100 dark:bg-gray-800 p-2 text-center">
                    <span class="text-xs font-semibold text-gray-700 dark:text-gray-300">Sat</span>
                </div>
                <div class="bg-gray-100 dark:bg-gray-800 p-2 text-center">
                    <span class="text-xs font-semibold text-gray-700 dark:text-gray-300">Sun</span>
                </div>
                <!-- Time slots and schedule cells will be rendered here by WeeklyView.js -->
            </div>
        </div>
    </main>

    <!-- FAB Button - Add New Schedule -->
    <button id="addScheduleFab" class="fixed bottom-6 right-6 bg-blue-600 hover:bg-blue-700 text-white rounded-full w-14 h-14 shadow-lg flex items-center justify-center transition-transform hover:scale-110">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
        </svg>
    </button>

    <!-- Modal for Add/Edit Schedule -->
    <div id="scheduleModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl max-w-md w-full mx-4">
            <div class="p-4 border-b border-gray-200 dark:border-gray-700">
                <h2 id="modalTitle" class="text-lg font-semibold text-gray-900 dark:text-white" data-i18n="modal.addTitle">Add Schedule</h2>
            </div>
            <form id="scheduleForm" class="p-4 space-y-4">
                <input type="hidden" id="scheduleId">
                <input type="hidden" id="scheduleDay">
                <input type="hidden" id="scheduleStartTime">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" data-i18n="modal.name">Name *</label>
                    <input type="text" id="scheduleName" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" data-i18n="modal.tagColor">Tag Color</label>
                    <select id="scheduleTag" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                        <option value="blue" data-i18n="tags.blue">Blue - General</option>
                        <option value="green" data-i18n="tags.green">Green - Study</option>
                        <option value="red" data-i18n="tags.red">Red - Deadline</option>
                        <option value="yellow" data-i18n="tags.yellow">Yellow - Meeting</option>
                        <option value="purple" data-i18n="tags.purple">Purple - Personal</option>
                        <option value="orange" data-i18n="tags.orange">Orange - Work</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" data-i18n="modal.notes">Notes</label>
                    <textarea id="scheduleNotes" rows="2" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" data-i18n="modal.startTime">Start Time</label>
                        <input type="time" id="startTimeDisplay" disabled class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-gray-100 dark:bg-gray-600 text-gray-900 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" data-i18n="modal.endTime">End Time</label>
                        <input type="time" id="endTimeDisplay" disabled class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-gray-100 dark:bg-gray-600 text-gray-900 dark:text-white">
                    </div>
                </div>
            </form>
            <div class="p-4 border-t border-gray-200 dark:border-gray-700 flex justify-end space-x-2">
                <button type="button" id="cancelScheduleBtn" class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-700 rounded-md hover:bg-gray-200 dark:hover:bg-gray-600" data-i18n="modal.cancel">Cancel</button>
                <button type="submit" form="scheduleForm" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700" data-i18n="modal.save">Save</button>
            </div>
        </div>
    </div>

    <!-- Detail Panel (Slide-in from right) -->
    <div id="detailPanel" class="hidden fixed top-0 right-0 h-full w-80 bg-white dark:bg-gray-800 shadow-xl transform translate-x-full transition-transform duration-300 z-40">
        <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white" data-i18n="panel.details">Details</h3>
            <button id="closeDetailPanel" class="p-1 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
                <svg class="w-5 h-5 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <div id="detailPanelContent" class="p-4 space-y-4">
            <!-- Content will be populated dynamically -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/i18n/en.js"></script>
    <script src="js/i18n/vi.js"></script>
    <script src="js/core/constants.js"></script>
    <script src="js/core/config.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/utils/DateTimeHelper.js"></script>
    <script src="js/models/Schedule.js"></script>
    <script src="js/models/Settings.js"></script>
    <script src="js/repositories/ScheduleRepository.js"></script>
    <script src="js/services/StorageService.js"></script>
    <script src="js/services/SettingsService.js"></script>
    <script src="js/services/ScheduleService.js"></script>
    <script src="js/services/NotificationService.js"></script>
    <script src="js/views/WeeklyView.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
